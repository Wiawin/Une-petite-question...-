<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Une petite question</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', Verdana, sans-serif;
    background: linear-gradient(135deg, #e8eef5, #d5dfeb, #e3eaf3);
    background-size: 300% 300%;
    animation: gradientMove 12s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    padding: 20px;
  }
  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card {
    background: rgba(255,255,255,0.92);
    border-radius: 28px;
    padding: 40px 30px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(60,90,130,0.25);
    position: relative;
    animation: popIn 0.6s ease;
  }
  @keyframes popIn {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  h1 { color: #2f4766; font-size: 1.7em; margin-bottom: 10px; }
  p.sub { color: #4f6684; font-size: 1.05em; margin-bottom: 30px; line-height: 1.5; }

  .btn-zone { position: relative; height: 230px; }

  button {
    border: none;
    border-radius: 50px;
    padding: 14px 34px;
    font-size: 1.1em;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, left 0.25s ease, top 0.25s ease;
  }

  #yesBtn, .yes-style {
    background: linear-gradient(135deg, #4f7cac, #35618f);
    color: white;
    box-shadow: 0 8px 20px rgba(53,97,143,0.35);
  }

  #yesBtn {
    position: absolute;
    left: 50%;
    top: 20px;
    transform: translateX(-50%);
  }
  #yesBtn:hover { transform: translateX(-50%) scale(1.08); }
  .yes-style:hover { transform: scale(1.08); }

  #noBtn {
    background: #f1f1f1;
    color: #888;
    position: absolute;
    left: 50%;
    top: 90px;
    transform: translateX(-50%);
    transition: left 0.25s ease, top 0.25s ease, transform 0.25s ease;
  }

  .hidden { display: none !important; }
  .reveal { animation: popIn 0.5s ease; }

  .big-emoji {
    font-size: 4em;
    margin-bottom: 10px;
    animation: bounce 1s ease infinite alternate;
  }
  @keyframes bounce { to { transform: translateY(-14px); } }

  .option-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
    margin: 20px 0;
  }
  .option-card {
    background: #f1f5fa;
    border: 2px solid #d5dfeb;
    border-radius: 18px;
    padding: 16px 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
  }
  .option-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 16px rgba(60,90,130,0.2);
  }
  .option-card.selected {
    background: linear-gradient(135deg, #6f98c3, #4f7cac);
    border-color: #35618f;
    color: white;
    transform: scale(1.03);
  }
  .option-card .emoji { font-size: 2em; display: block; margin-bottom: 6px; }
  .option-card .label { font-size: 0.9em; font-weight: 600; }

  label {
    display: block;
    text-align: left;
    color: #4f6684;
    font-weight: 600;
    margin: 16px 0 6px 4px;
    font-size: 0.95em;
  }
  input[type="date"], input[type="time"] {
    width: 100%;
    padding: 12px;
    border-radius: 14px;
    border: 2px solid #d5dfeb;
    font-size: 1em;
    color: #2f4766;
    outline: none;
  }
  input[type="date"]:focus, input[type="time"]:focus { border-color: #4f7cac; }

  .dt-row { display: flex; gap: 12px; }
  .dt-row > div { flex: 1; }

  #sendBtn {
    margin-top: 22px;
    width: 100%;
    background: linear-gradient(135deg, #4f7cac, #35618f);
    color: white;
    padding: 16px;
    font-size: 1.1em;
    box-shadow: 0 8px 20px rgba(53,97,143,0.35);
  }
  #sendBtn:disabled {
    background: #c5d3e3;
    box-shadow: none;
    cursor: not-allowed;
  }
  #sendBtn:hover:not(:disabled) { transform: scale(1.03); }

  .recap {
    background: #f1f5fa;
    border-radius: 16px;
    padding: 18px;
    margin-top: 18px;
    text-align: left;
    color: #4f6684;
    line-height: 1.7;
  }
  .recap b { color: #2f4766; }

  .copy-btn {
    margin-top: 14px;
    background: #fff;
    border: 2px solid #4f7cac;
    color: #35618f;
    width: 100%;
    padding: 12px;
  }
  .copy-btn:hover { background: #f1f5fa; }

  small.hint {
    display: block;
    margin-top: 10px;
    color: #6b7f99;
    font-size: 0.8em;
  }

  @media (max-width: 420px) {
    .card { padding: 28px 18px; border-radius: 20px; }
    h1 { font-size: 1.4em; }
    p.sub { font-size: 0.95em; }
    input[type="date"], input[type="time"] { font-size: 0.82em; padding: 10px; }
    .option-grid { gap: 10px; }
    .option-card { padding: 12px 4px; }
    .option-card .emoji { font-size: 1.6em; }
    .option-card .label { font-size: 0.8em; }
  }
</style>
</head>
<body>

<!-- PAGE 1 : LA DEMANDE -->
<div class="card" id="page1">
  <h1>Salut !</h1>
  <p class="sub">J'ai une petite question à te poser...<br>
  Ça te dirait qu'on se fasse un date ?</p>

  <div class="btn-zone" id="btnZone">
    <button id="yesBtn" onclick="sayYes()">Oui</button>
    <button id="noBtn">Non</button>
  </div>
  <small class="hint">(le bouton "non" est un peu timide...)</small>
</div>

<!-- PAGE 2 : CONFIRMATION -->
<div class="card hidden" id="page2">
  <div class="reveal">
    <div class="big-emoji">🎉</div>
    <h1>Super !</h1>
    <p class="sub">Organisons ça ensemble.</p>
    <button class="yes-style" onclick="goToPlanning()">C'est parti →</button>
  </div>
</div>

<!-- PAGE 3 : PLANIFICATION -->
<div class="card hidden" id="page3">
  <h1>On planifie ça</h1>
  <p class="sub">Choisis la date, l'heure et le type de sortie.</p>

  <div class="dt-row">
    <div>
      <label>📅 Date</label>
      <input type="date" id="dateInput">
    </div>
    <div>
      <label>🕐 Heure</label>
      <input type="time" id="timeInput">
    </div>
  </div>

  <label style="margin-top:22px;">Le type de sortie</label>
  <div class="option-grid" id="optionGrid">
    <div class="option-card" data-value="Restaurant 🍝">
      <span class="emoji">🍝</span><span class="label">Restaurant</span>
    </div>
    <div class="option-card" data-value="Bowling 🎳">
      <span class="emoji">🎳</span><span class="label">Bowling</span>
    </div>
    <div class="option-card" data-value="Verre 🍹">
      <span class="emoji">🍹</span><span class="label">Verre</span>
    </div>
  </div>

  <button id="sendBtn" disabled onclick="showRecap()">Valider</button>
</div>

<!-- PAGE 4 : RECAP -->
<div class="card hidden" id="page4">
  <div class="reveal">
    <div class="big-emoji">✅</div>
    <h1>C'est noté !</h1>
    <div class="recap" id="recapText"></div>
    <button class="copy-btn" onclick="copyRecap()">📋 Copier le message</button>
    <small class="hint" id="copyHint">Colle ce message à Thomas</small>
  </div>
</div>

<script>
  // bouton "non" qui fuit (souris et tactile)
  const noBtn = document.getElementById('noBtn');
  const btnZone = document.getElementById('btnZone');

  function dodge() {
    const zoneRect = btnZone.getBoundingClientRect();
    const btnW = noBtn.offsetWidth || 90;
    const btnH = noBtn.offsetHeight || 45;

    const scale = 0.55 + Math.random() * 0.6;
    noBtn.style.transform = `scale(${scale})`;

    const maxX = Math.max(zoneRect.width - btnW, 10);
    const maxY = Math.max(zoneRect.height - btnH, 10);

    noBtn.style.left = Math.random() * maxX + 'px';
    noBtn.style.top = Math.random() * maxY + 'px';
  }

  noBtn.addEventListener('pointerenter', dodge);
  noBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); dodge(); });
  noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); dodge(); }, { passive: false });
  noBtn.addEventListener('click', (e) => { e.preventDefault(); dodge(); });

  btnZone.addEventListener('touchmove', (e) => {
    const touch = e.touches[0];
    const r = noBtn.getBoundingClientRect();
    const dx = touch.clientX - (r.left + r.width / 2);
    const dy = touch.clientY - (r.top + r.height / 2);
    if (Math.sqrt(dx * dx + dy * dy) < 70) dodge();
  }, { passive: true });

  function sayYes() {
    document.getElementById('page1').classList.add('hidden');
    document.getElementById('page2').classList.remove('hidden');
  }

  function goToPlanning() {
    document.getElementById('page2').classList.add('hidden');
    document.getElementById('page3').classList.remove('hidden');
  }

  let selectedOption = null;
  document.querySelectorAll('.option-card').forEach(card => {
    card.addEventListener('click', () => {
      document.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedOption = card.dataset.value;
      checkFormReady();
    });
  });

  const dateInput = document.getElementById('dateInput');
  const timeInput = document.getElementById('timeInput');
  dateInput.addEventListener('change', checkFormReady);
  timeInput.addEventListener('change', checkFormReady);

  function checkFormReady() {
    document.getElementById('sendBtn').disabled = !(dateInput.value && timeInput.value && selectedOption);
  }

  function showRecap() {
    document.getElementById('page3').classList.add('hidden');
    document.getElementById('page4').classList.remove('hidden');

    const dateObj = new Date(dateInput.value + 'T' + timeInput.value);
    const dateStr = dateObj.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const timeStr = timeInput.value;

    document.getElementById('recapText').innerHTML =
      `<b>📅 Date :</b> ${dateStr}<br>` +
      `<b>🕐 Heure :</b> ${timeStr}<br>` +
      `<b>Sortie :</b> ${selectedOption}`;

    window._recapMessage = `Salut ! Pour notre date :\n📅 ${dateStr}\n🕐 ${timeStr}\nSortie : ${selectedOption}\nÀ bientôt !`;
  }

  function copyRecap() {
    navigator.clipboard.writeText(window._recapMessage).then(() => {
      document.getElementById('copyHint').textContent = 'Copié ! Colle ce message à Thomas';
    }).catch(() => {
      document.getElementById('copyHint').textContent = window._recapMessage;
    });
  }
</script>

</body>
</html>
